org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 默认启用内置 Kotlin；本项目继续用 KGP 2.3.21 + compose 编译器插件 + KSP，
# 官方 opt-out 标志，避免 "extension 'kotlin' already registered" 冲突。
android.builtInKotlin=false
# KGP 2.3 尚不兼容 AGP 9 新 DSL（BaseExtension 强转失败），官方临时绕行标志。
android.newDsl=false
org.gradle.configuration-cache=true
org.gradle.caching=true
# KSP's incremental release cache previously completed without emitting Room sources.
# Full processing is small here; never trade a usable database for a stale codegen cache.
ksp.incremental=false
